    function escapeHTML(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatTanggalIndo(dateStr) {
      if (!dateStr) return 'Info Terbaru';
      try {
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return dateStr;
        return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
      } catch (_) {
        return dateStr;
      }
    }

    function formatBulanTanggal(dateStr) {
      if (!dateStr) return { bln: 'INFO', tgl: 'SMP' };
      try {
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return { bln: 'INFO', tgl: 'SMP' };
        const bln = d.toLocaleDateString('en-US', { month: 'short' }).toUpperCase();
        const tgl = String(d.getDate()).padStart(2, '0');
        return { bln, tgl };
      } catch (_) {
        return { bln: 'INFO', tgl: 'SMP' };
      }
    }

    function hitungPredikat(rata) {
      const n = Number(rata) || 0;
      if (n >= 90) return 'A';
      if (n >= 80) return 'B';
      if (n >= 70) return 'C';
      return 'D';
    }

    function generateNoSpmb() {

    }

    function goToSlide(index) {

    // =========================================================================
    // SINKRONISASI DATA SUPABASE (SAAT IS_PREVIEW === false)
    // =========================================================================
    async function loadAllSupabaseData() {
      if (IS_PREVIEW || !supabase) return;
      state.loading = true;
      render();

      try {
        const { data: sessionData } = await supabase.auth.getSession();
        if (sessionData?.session?.user) {
          state.currentUser = {
            role: 'admin',
            id: sessionData.session.user.id,
            username: sessionData.session.user.email,
            nama_lengkap: 'Administrator Sekolah',
            kelas_atau_mapel: 'Admin Sistem'
          };
        } else {
          const savedWarga = sessionStorage.getItem('smp_warga_session');
          if (savedWarga) {
            try {
              state.currentUser = JSON.parse(savedWarga);
            } catch (_) {
              sessionStorage.removeItem('smp_warga_session');
            }
          }
        }

        const [resProfil, resPengguna, resBerita, resSpmb, resJM, resNilai] = await Promise.all([
          supabase.from('profil_sekolah').select('*').limit(1).maybeSingle(),
          supabase.from('pengguna_sekolah').select('*').order('nama_lengkap', { ascending: true }),
          supabase.from('berita_agenda').select('*').order('created_at', { ascending: false }),
          supabase.from('pendaftaran_spmb').select('*').order('created_at', { ascending: false }),
          supabase.from('jadwal_materi').select('*').order('created_at', { ascending: false }),
          supabase.from('nilai_akademik').select('*').order('updated_at', { ascending: false })
        ]);

        if (resProfil.data) state.profil = resProfil.data;
        if (resPengguna.data) state.pengguna = resPengguna.data;
        if (resBerita.data) state.berita = resBerita.data;
        if (resSpmb.data) state.spmb = resSpmb.data;
        if (resJM.data) state.jadwal_materi = resJM.data;
        if (resNilai.data) state.nilai = resNilai.data;
      } catch (err) {
        console.error('Gagal memuat data Supabase:', err);
        showToast('Gagal terhubung ke database Supabase. Periksa URL & Anon Key.', 'error');
      } finally {
        state.loading = false;
        render();
      }
    }

    async function handleAdminLogin(email, password) {
      if (IS_PREVIEW) {
        state.currentUser = {
          role: 'admin',
          id: 'prev-admin',
          username: email || 'admin@smp.sch.id',
          nama_lengkap: 'Admin Sekolah (Preview)',
          kelas_atau_mapel: 'Operator Utama'

        state.showLoginModal = false;
        state.activeMenu = 'admin';
        showToast('Berhasil masuk sebagai Admin (Mode Preview)');
        return;
      }

      try {
        state.loading = true;
        render();
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;

        sessionStorage.removeItem('smp_warga_session');
        state.currentUser = {
          role: 'admin',
          id: data.user.id,
          username: data.user.email,
          nama_lengkap: 'Administrator Sekolah',
          kelas_atau_mapel: 'Admin Sistem'
        };
        state.showLoginModal = false;
        state.activeMenu = 'admin';
        showToast('Selamat datang kembali, Admin Sekolah!');
        await loadAllSupabaseData();
      } catch (err) {
        showToast('Login Admin gagal: ' + (err.message || 'Email atau password salah'), 'error');
      } finally {
        state.loading = false;
        render();
      }
    }

    async function handleWargaLogin(username, password) {
      if (IS_PREVIEW) {
        const found = state.pengguna.find(
          (u) => u.username === username && u.password === password && u.aktif
        );
        if (!found) {
          showToast('NISN/NIP atau Password tidak cocok (Mode Preview)', 'error');
          return;
        }
        state.currentUser = {
          role: found.peran,
          id: found.id,
          username: found.username,
          nama_lengkap: found.nama_lengkap,
          kelas_atau_mapel: found.kelas_atau_mapel
        };
        state.showLoginModal = false;
        state.activeMenu = 'akademik';
        showToast(`Berhasil masuk sebagai ${found.nama_lengkap}`);
        return;
      }

      try {
        state.loading = true;
        render();
        const { data, error } = await supabase
          .from('pengguna_sekolah')
          .select('*')
          .eq('username', username.trim())
          .eq('password', password.trim())
          .eq('aktif', true)
          .maybeSingle();

        if (error) throw error;
        if (!data) {
          showToast('NISN/NIP atau Password salah, atau akun dinonaktifkan.', 'error');
          return;
        }

        state.currentUser = {
          role: data.peran,
          id: data.id,
          username: data.username,
          nama_lengkap: data.nama_lengkap,
          kelas_atau_mapel: data.kelas_atau_mapel

        sessionStorage.setItem('smp_warga_session', JSON.stringify(state.currentUser));
        state.showLoginModal = false;
        state.activeMenu = 'akademik';
        showToast(`Selamat datang, ${data.nama_lengkap}!`);
      } catch (err) {
        showToast('Terjadi kesalahan saat login: ' + err.message, 'error');
      } finally {
        state.loading = false;
        render();
      }
    }

    async function handleLogout() {
      if (!IS_PREVIEW && supabase && state.currentUser?.role === 'admin') {
        await supabase.auth.signOut();
      }
      sessionStorage.removeItem('smp_warga_session');
      state.currentUser = null;
      if (state.activeMenu === 'admin') state.activeMenu = 'beranda';
      showToast('Anda telah keluar dari akun.');
    }

    // =========================================================================
    // OPERASI CRUD (MENDUKUNG MODE PREVIEW LOKAL & SUPABASE REAL-TIME)
    // =========================================================================
    async function saveProfilSekolah(payload) {
      if (IS_PREVIEW) {
        state.profil = { ...state.profil, ...payload };
        showToast('Profil sekolah diperbarui (Mode Preview)');
        return;
      }
      try {
        state.loading = true;
        render();
        if (state.profil?.id) {
          const { data, error } = await supabase
            .from('profil_sekolah')
            .update({ ...payload, updated_at: new Date().toISOString() })
            .eq('id', state.profil.id)
            .select()
            .single();
          if (error) throw error;
          state.profil = data;
        } else {
          const { data, error } = await supabase
            .from('profil_sekolah')
            .insert([payload])
            .select()
            .single();
          if (error) throw error;

    async function cekStatusSpmb(query) {
      const q = query.trim().toLowerCase();
      if (!q) {
        showToast('Masukkan Nomor Pendaftaran atau NISN terlebih dahulu.', 'error');
        return;
      }

      if (IS_PREVIEW) {
        const found = state.spmb.find(
          (item) =>
            item.no_pendaftaran.toLowerCase() === q ||
            item.nisn.toLowerCase() === q
        );
        state.spmbCekResult = found || null;
        render();
        return;
      }

      try {
        state.loading = true;
        render();
        const { data, error } = await supabase
          .from('pendaftaran_spmb')
          .select('*')
          .or(`no_pendaftaran.ilike.${q},nisn.eq.${q}`)
          .limit(1)
          .maybeSingle();
        if (error) throw error;
        state.spmbCekResult = data || null;
      } catch (err) {
        showToast('Gagal memeriksa status SPMB: ' + err.message, 'error');
      } finally {
        state.loading = false;
        render();
      }
    }

                    <div class="relative h-44 bg-gradient-to-br from-[#1E3A8A] to-[#0284C7] flex items-center justify-center text-white">
                      ${item.gambar_url ? `
                        <img src="${escapeHTML(item.gambar_url)}" alt="${escapeHTML(item.judul)}" class="w-full h-full object-cover" onerror="this.style.display='none'" />
                      ` : `
                        <i data-lucide="newspaper" class="w-10 h-10 text-white/40"></i>
                      `}
                      <div class="absolute bottom-0 inset-x-0 bg-[#0095D9]/95 text-white text-[11px] font-semibold px-3 py-1">
                        ${escapeHTML(formatTanggalIndo(item.tanggal_kegiatan))}
                      </div>
                    </div>
                    <div class="p-5 space-y-2">
                      ${renderKategoriBadge(item.kategori)}
                      <h2 class="text-base font-extrabold text-slate-900 leading-snug">${escapeHTML(item.judul)}</h2>
                      <p class="text-xs text-slate-600 leading-relaxed line-clamp-3">${escapeHTML(item.ringkasan)}</p>
                    </div>
                  </div>
                  <div class="px-5 pb-4 pt-2 flex items-center justify-between border-t border-slate-100">
                    <span class="text-[11px] text-slate-400">Oleh: ${escapeHTML(item.penulis || 'Admin')}</span>
                    <button data-open-berita="${escapeHTML(item.id)}" class="text-xs font-bold text-blue-700 hover:underline">
                      Baca Detail &rsaquo;
                    </button>
                  </div>
                </article>
              `).join('')}
            </div>
          `}
        </div>
      `;
    }

    // =========================================================================
    // HALAMAN SPMB ONLINE (SISTEM PENERIMAAN MURID BARU)
    // =========================================================================
    function renderSpmb() {
      return `
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

            </div>
            <div class="inline-flex rounded-lg bg-slate-100 p-1 border border-slate-200 self-start">
              <button data-spmb-tab="daftar" class="px-4 py-2 rounded text-xs font-bold transition ${

                <h2 class="text-lg font-bold text-slate-900">Pendaftaran SPMB Sedang Ditutup</h2>
                <p class="text-sm text-slate-600 max-w-md mx-auto">
                  Mohon maaf, formulir pendaftaran murid baru saat ini belum dibuka atau sudah ditutup oleh panitia sekolah. Anda tetap dapat mengecek status seleksi pada tab <strong>Cek Status Seleksi</strong>.

            ` : `

                  <div class="flex items-start justify-between gap-4">
                    <div>
                      <h3 class="text-base font-extrabold text-emerald-900">Bukti Pendaftaran SPMB Berhasil Dibuat!</h3>
                      <p class="text-xs text-emerald-800">Simpan Nomor Pendaftaran di bawah ini untuk mengecek hasil seleksi.</p>
                    </div>
                    <button data-close-receipt class="text-xs text-slate-600 hover:text-slate-900 underline">Tutup</button>
                  </div>
                  <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-white rounded-lg p-4 border border-emerald-200">
                    <div>
                      <div class="text-[11px] text-slate-500">Nomor Pendaftaran</div>
                      <div class="text-base font-extrabold text-[#1E3A8A]">${escapeHTML(state.lastSpmbReceipt.no_pendaftaran)}</div>
                    </div>
                    <div>
                      <div class="text-[11px] text-slate-500">Nama Calon Murid</div>
                      <div class="text-sm font-bold text-slate-900">${escapeHTML(state.lastSpmbReceipt.nama_lengkap)}</div>
                    </div>
                    <div>
                      <div class="text-[11px] text-slate-500">Jalur & Status</div>
                      <div class="text-sm font-semibold text-slate-800">${escapeHTML(state.lastSpmbReceipt.jalur_pendaftaran)} • ${escapeHTML(state.lastSpmbReceipt.status_seleksi)}</div>
                    </div>
                  </div>
                </div>
              ` : ''}

              <div class="bg-white rounded-xl border border-slate-200 p-6 md:p-8 shadow-sm">
                <h2 class="text-lg font-bold text-[#1E3A8A] mb-1">Formulir Calon Murid Baru Jenjang SMP</h2>
                <p class="text-xs text-slate-500 mb-6">Lengkapi data diri calon murid sesuai dengan Ijazah/Rapor SD/MI dan Kartu Keluarga.</p>

                <form id="form-spmb" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">NISN (10 Digit) *</label>
                    <input name="nisn" required placeholder="Contoh: 0134567890" class="w-full px-3.5 py-2.5 rounded-lg bg-white border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">Nama Lengkap Calon Murid *</label>
                    <input name="nama_lengkap" required placeholder="Nama sesuai akta kelahiran" class="w-full px-3.5 py-2.5 rounded-lg bg-white border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">Jenis Kelamin *</label>
                    <select name="jenis_kelamin" required class="w-full px-3.5 py-2.5 rounded-lg bg-white border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600">
                      <option value="Laki-laki">Laki-laki</option>
                      <option value="Perempuan">Perempuan</option>
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">Asal Sekolah (SD / MI) *</label>
                    <input name="asal_sd" required placeholder="Contoh: SDN 01 Harapan" class="w-full px-3.5 py-2.5 rounded-lg bg-white border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">Jalur Pendaftaran SPMB *</label>
                    <select name="jalur_pendaftaran" required class="w-full px-3.5 py-2.5 rounded-lg bg-white border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600">
                      <option value="Domisili">Jalur Domisili</option>
                      <option value="Afirmasi">Jalur Afirmasi</option>
                      <option value="Prestasi">Jalur Prestasi</option>
                      <option value="Mutasi">Jalur Mutasi</option>
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">Nilai Rata-Rata Rapor / Ijazah SD *</label>
                    <input name="nilai_rata_sd" type="number" step="0.01" min="0" max="100" required placeholder="Contoh: 87.50" class="w-full px-3.5 py-2.5 rounded-lg bg-white border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">Nomor WhatsApp Orang Tua / Wali *</label>
                    <input name="no_hp_ortu" required placeholder="Contoh: 081234567890" class="w-full px-3.5 py-2.5 rounded-lg bg-white border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">Alamat Domisili Lengkap *</label>
                    <input name="alamat" required placeholder="Jalan, RT/RW, Kelurahan/Desa" class="w-full px-3.5 py-2.5 rounded-lg bg-white border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
                  </div>
                  <div class="md:col-span-2 pt-2 flex justify-end">
                    <button type="submit" class="inline-flex items-center gap-2 px-6 py-3 rounded-lg bg-[#1E3A8A] hover:bg-blue-900 text-white font-bold text-sm transition">
                      Kirim Pendaftaran SPMB &rsaquo;
                    </button>
                  </div>
                </form>
              </div>
            `}
          ` : `
            <div class="bg-white rounded-xl border border-slate-200 p-6 md:p-8 max-w-2xl mx-auto space-y-5 shadow-sm">
              <div class="text-center space-y-1.5">
                <h2 class="text-lg font-bold text-[#1E3A8A]">Cek Hasil Seleksi SPMB</h2>
                <p class="text-xs text-slate-500">Masukkan Nomor Pendaftaran SPMB (contoh: SPMB-2026-001) atau NISN calon murid.</p>
              </div>

              <form id="form-cek-spmb" class="flex flex-col sm:flex-row gap-2.5">
                <input name="query" value="${escapeHTML(state.spmbCekQuery)}" required placeholder="Ketik Nomor Pendaftaran atau NISN..." class="flex-1 px-4 py-2.5 rounded-lg bg-white border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
                <button type="submit" class="px-5 py-2.5 rounded-lg bg-[#0284C7] hover:bg-sky-700 text-white font-bold text-sm transition shrink-0">
                  Periksa Status
                </button>
              </form>

              ${state.spmbCekResult === null ? `
                <div class="rounded-lg bg-rose-50 border border-rose-200 p-4 text-center text-xs text-rose-700 font-semibold">
                  Data pendaftaran dengan Nomor Pendaftaran / NISN tersebut tidak ditemukan. Pastikan penulisan sudah benar.
                </div>
              ` : state.spmbCekResult ? `
                <div class="rounded-xl bg-slate-50 border border-slate-200 p-5 space-y-3">
                  <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-200 pb-3">
                    <div>
                      <div class="text-xs text-slate-500">No. Pendaftaran: ${escapeHTML(state.spmbCekResult.no_pendaftaran)}</div>
                      <h3 class="text-base font-extrabold text-slate-900">${escapeHTML(state.spmbCekResult.nama_lengkap)}</h3>
                    </div>
                    ${renderBadgeStatusSpmb(state.spmbCekResult.status_seleksi)}
                  </div>
                  <div class="grid grid-cols-2 gap-3 text-xs">
                    <div>
                      <span class="text-slate-400 block">NISN</span>
                      <span class="font-bold text-slate-800">${escapeHTML(state.spmbCekResult.nisn)}</span>
                    </div>
                    <div>
                      <span class="text-slate-400 block">Jalur SPMB</span>
                      <span class="font-bold text-slate-800">${escapeHTML(state.spmbCekResult.jalur_pendaftaran)}</span>
                    </div>
                    <div>
                      <span class="text-slate-400 block">Asal SD/MI</span>
                      <span class="font-bold text-slate-800">${escapeHTML(state.spmbCekResult.asal_sd)}</span>
                    </div>
                    <div>
                      <span class="text-slate-400 block">Nilai Rata-rata</span>
                      <span class="font-bold text-slate-800">${escapeHTML(state.spmbCekResult.nilai_rata_sd)}</span>
                    </div>
                  </div>
                  <div class="rounded-lg bg-white border border-slate-200 p-3 text-xs text-slate-700">
                    <strong>Catatan Panitia:</strong> ${escapeHTML(state.spmbCekResult.catatan_admin || '-')}
                  </div>
                </div>
              ` : ''}
            </div>
          `}
        </div>
      `;
    }

    // =========================================================================
    // HALAMAN PORTAL AKADEMIK (JADWAL, E-LEARNING, CEK NILAI)
    // =========================================================================
    function renderAkademik() {
      const user = state.currentUser;
      const isGuruOrAdmin = user && (user.role === 'guru' || user.role === 'admin');
      const isSiswa = user && user.role === 'siswa';

      const jadwalFiltered = state.jadwal_materi.filter(
        (item) => item.tipe === 'Jadwal' && item.kelas === state.kelasFilter
      );
      const materiFiltered = state.jadwal_materi.filter(
        (item) => item.tipe === 'Materi' && item.kelas === state.kelasFilter
      );

      const siswaList = state.pengguna.filter((u) => u.peran === 'siswa');
      const nilaiFiltered = isSiswa
        ? state.nilai.filter((n) => n.siswa_id === user.id)
        : state.nilai;

      return `
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-200 pb-4">
            <div>
              <h1 class="text-2xl font-extrabold text-[#1E3A8A]">Portal Akademik & E-Learning</h1>
              <p class="text-sm text-slate-500 mt-1">Jadwal pelajaran, modul materi digital, dan rekap nilai akademik siswa SMP.</p>
            </div>
            <div class="inline-flex rounded-lg bg-slate-100 p-1 border border-slate-200 self-start">
              <button data-akademik-tab="jadwal" class="px-3.5 py-2 rounded text-xs font-bold transition ${
                state.akademikTab === 'jadwal' ? 'bg-[#1E3A8A] text-white' : 'text-slate-600 hover:text-slate-900'
              }">
                Jadwal Pelajaran
              </button>
              <button data-akademik-tab="materi" class="px-3.5 py-2 rounded text-xs font-bold transition ${
                state.akademikTab === 'materi' ? 'bg-[#1E3A8A] text-white' : 'text-slate-600 hover:text-slate-900'
              }">
                E-Learning & Tugas
              </button>
              <button data-akademik-tab="nilai" class="px-3.5 py-2 rounded text-xs font-bold transition ${
                state.akademikTab === 'nilai' ? 'bg-[#1E3A8A] text-white' : 'text-slate-600 hover:text-slate-900'
              }">
                Cek Nilai Digital
              </button>
            </div>
          </div>

          ${!user ? `
            <div class="rounded-xl p-4 bg-sky-50 border border-sky-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <p class="text-xs sm:text-sm text-slate-700">
                Masuk menggunakan akun <strong>Siswa (NISN)</strong> untuk melihat nilai rapor Anda, atau akun <strong>Guru (NIP)</strong> untuk mengelola materi dan menginput nilai.
              </p>
              <button data-open-login class="px-4 py-2 rounded-lg bg-[#1E3A8A] hover:bg-blue-900 text-white text-xs font-bold shrink-0">
                Login Portal Akademik
              </button>
            </div>
          ` : `
            <div class="rounded-xl p-4 bg-emerald-50 border border-emerald-200 flex items-center justify-between gap-3">
              <div class="text-xs sm:text-sm text-emerald-950">
                Masuk sebagai <strong>${escapeHTML(user.nama_lengkap)}</strong>
                <span class="ml-2 px-2 py-0.5 rounded bg-emerald-600 text-white text-xs font-bold uppercase">${escapeHTML(user.role)}</span>
                ${user.kelas_atau_mapel ? `<span class="text-emerald-800 ml-1">(${escapeHTML(user.kelas_atau_mapel)})</span>` : ''}
              </div>
            </div>
          `}

          ${state.akademikTab !== 'nilai' ? `
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold text-slate-600 mr-1">Pilih Jenjang Kelas:</span>
              ${['VII', 'VIII', 'IX'].map((kls) => `
                <button data-kelas-filter="${kls}" class="px-4 py-1.5 rounded text-xs font-bold transition ${
                  state.kelasFilter === kls
                    ? 'bg-[#0284C7] text-white'
                    : 'bg-slate-100 text-slate-700 hover:bg-slate-200'
                }">
                  Kelas ${kls}
                </button>
              `).join('')}
            </div>
          ` : ''}

          ${state.akademikTab === 'jadwal' ? `
            <div class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm space-y-4">
              <h2 class="text-lg font-bold text-[#1E3A8A]">Jadwal Pelajaran — Kelas ${state.kelasFilter}</h2>
              ${jadwalFiltered.length === 0 ? `
                <div class="rounded-lg border border-dashed border-slate-300 p-8 text-center">
                  <p class="text-sm text-slate-500">Belum ada jadwal pelajaran untuk Kelas ${state.kelasFilter}.</p>

              ` : `
                <div class="overflow-x-auto">
                  <table class="w-full text-left border-collapse text-sm">

                      <tr class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-600 uppercase">

                        <th class="py-3 px-3">Jam</th>
                        <th class="py-3 px-3">Mata Pelajaran</th>
                        <th class="py-3 px-3">Guru Pengampu</th>
                        <th class="py-3 px-3">Keterangan / Ruang</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-200">
                      ${jadwalFiltered.map((j) => `
                        <tr class="hover:bg-slate-50">
                          <td class="py-3 px-3 font-bold text-slate-900">${escapeHTML(j.hari)}</td>
                          <td class="py-3 px-3 text-slate-600">${escapeHTML(j.jam_pelajaran)}</td>
                          <td class="py-3 px-3 font-bold text-blue-800">${escapeHTML(j.mata_pelajaran)}</td>
                          <td class="py-3 px-3 text-slate-700">${escapeHTML(j.nama_guru)}</td>
                          <td class="py-3 px-3 text-xs text-slate-500">${escapeHTML(j.deskripsi_atau_link || '-')}</td>
                        </tr>
                      `).join('')}
                    </tbody>
                  </table>
                </div>
              `}
            </div>
          ` : ''}

          ${state.akademikTab === 'materi' ? `
            <div class="space-y-5">
              ${isGuruOrAdmin ? `
                <div class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm space-y-4">
                  <h3 class="text-base font-bold text-[#1E3A8A]">Bagikan Materi / Tugas Baru (Kelas ${state.kelasFilter})</h3>
                  <form id="form-tambah-materi" class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <input type="hidden" name="kelas" value="${state.kelasFilter}" />
                    <div>
                      <label class="block text-xs font-bold text-slate-700 mb-1">Mata Pelajaran *</label>
                      <input name="mata_pelajaran" required value="${user.role === 'guru' ? escapeHTML(user.kelas_atau_mapel) : ''}" placeholder="Contoh: IPA Terpadu" class="w-full px-3.5 py-2 rounded-lg bg-white border border-slate-300 text-sm" />
                    </div>
                    <div>
                      <label class="block text-xs font-bold text-slate-700 mb-1">Judul Materi / Tugas *</label>
                      <input name="judul_materi" required placeholder="Contoh: Rangkuman Sistem Tata Surya" class="w-full px-3.5 py-2 rounded-lg bg-white border border-slate-300 text-sm" />
                    </div>
                    <div class="md:col-span-2">
                      <label class="block text-xs font-bold text-slate-700 mb-1">Instruksi Tugas atau Tautan Modul *</label>
                      <textarea name="deskripsi_atau_link" rows="2" required placeholder="Tuliskan ringkasan materi atau tempel tautan dokumen pembelajaran..." class="w-full px-3.5 py-2 rounded-lg bg-white border border-slate-300 text-sm"></textarea>
                    </div>
                    <div class="md:col-span-2 flex justify-end">
                      <button type="submit" class="px-5 py-2.5 rounded-lg bg-[#0284C7] hover:bg-sky-700 text-white text-xs font-bold">
                        Publikasikan Materi
                      </button>
                    </div>
                  </form>
                </div>
              ` : ''}

              <div class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm space-y-4">
                <h2 class="text-lg font-bold text-[#1E3A8A]">Daftar Materi & Tugas — Kelas ${state.kelasFilter}</h2>
                ${materiFiltered.length === 0 ? `
                  <div class="rounded-lg border border-dashed border-slate-300 p-8 text-center">
                    <p class="text-sm text-slate-500">Belum ada materi E-Learning untuk Kelas ${state.kelasFilter}.</p>
                  </div>
                ` : `
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    ${materiFiltered.map((m) => `
                      <div class="rounded-lg bg-slate-50 border border-slate-200 p-4 space-y-2 flex flex-col justify-between">
                        <div class="space-y-1.5">
                          <div class="flex items-center justify-between gap-2">
                            <span class="px-2.5 py-0.5 rounded bg-blue-100 text-blue-800 text-xs font-bold">${escapeHTML(m.mata_pelajaran)}</span>
                            <span class="text-[11px] text-slate-400">Oleh: ${escapeHTML(m.nama_guru)}</span>
                          </div>
                          <h3 class="text-sm font-bold text-slate-900">${escapeHTML(m.judul_materi)}</h3>
                          <p class="text-xs text-slate-600 leading-relaxed break-words">${escapeHTML(m.deskripsi_atau_link)}</p>
                        </div>
                        ${isGuruOrAdmin ? `
                          <div class="pt-2 border-t border-slate-200 flex justify-end">
                            <button data-delete-jm="${escapeHTML(m.id)}" class="text-xs text-rose-600 hover:underline font-semibold">Hapus Materi</button>
                          </div>

                      </div>
                    `).join('')}
                  </div>
                `}
              </div>
            </div>
          ` : ''}

          ${state.akademikTab === 'nilai' ? `
            ${!user ? `
              <div class="bg-white rounded-xl border border-slate-200 p-10 text-center space-y-3 shadow-sm">
                <h3 class="text-base font-bold text-slate-900">Akses Terbatas Warga Sekolah</h3>
                <p class="text-xs text-slate-500 max-w-md mx-auto">Silakan masuk menggunakan akun Siswa (NISN) atau Guru (NIP) untuk mengakses layanan nilai akademik digital.</p>
                <button data-open-login class="px-5 py-2.5 rounded-lg bg-[#1E3A8A] text-white text-xs font-bold">Masuk Sekarang</button>
              </div>
            ` : `
              <div class="space-y-5">
                ${isGuruOrAdmin ? `

                        <div>
                          <label class="block text-xs font-bold text-slate-700 mb-1">Mata Pelajaran *</label>
                          <input name="mata_pelajaran" required value="${user.role === 'guru' ? escapeHTML(user.kelas_atau_mapel) : ''}" placeholder="Contoh: Bahasa Indonesia" class="w-full px-3 py-2 rounded-lg bg-white border border-slate-300 text-sm" />
                        </div>
                        <div>
                          <label class="block text-xs font-bold text-slate-700 mb-1">Semester *</label>
                          <select name="semester" class="w-full px-3 py-2 rounded-lg bg-white border border-slate-300 text-sm">

                            <option value="Genap">Genap</option>

                        </div>
                        <div>
                          <label class="block text-xs font-bold text-slate-700 mb-1">Nilai Tugas (0-100) *</label>

                        <div>
                          <label class="block text-xs font-bold text-slate-700 mb-1">Nilai UTS (0-100) *</label>
                          <input name="nilai_uts" type="number" min="0" max="100" required placeholder="82" class="w-full px-3 py-2 rounded-lg bg-white border border-slate-300 text-sm" />

                        <div>
                          <label class="block text-xs font-bold text-slate-700 mb-1">Nilai UAS (0-100) *</label>
                          <input name="nilai_uas" type="number" min="0" max="100" required placeholder="88" class="w-full px-3 py-2 rounded-lg bg-white border border-slate-300 text-sm" />

                          <label class="block text-xs font-bold text-slate-700 mb-1">Catatan Guru</label>
                          <input name="catatan_guru" placeholder="Catatan perkembangan belajar siswa..." class="w-full px-3 py-2 rounded-lg bg-white border border-slate-300 text-sm" />
                        </div>
                        <div class="sm:col-span-2 lg:col-span-3 flex justify-end">
                          <button type="submit" class="px-5 py-2.5 rounded-lg bg-[#1E3A8A] hover:bg-blue-900 text-white text-xs font-bold">Simpan Nilai Siswa</button>
                        </div>
                      </form>
                    `}
                  </div>
                ` : ''}

                <div class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm space-y-4">
                  <h2 class="text-lg font-bold text-[#1E3A8A]">
                    ${isSiswa ? `Rekap Nilai Akademik — ${escapeHTML(user.nama_lengkap)}` : 'Daftar Nilai Akademik Tercatat'}
                  </h2>

                  ${nilaiFiltered.length === 0 ? `
                    <div class="rounded-lg border border-dashed border-slate-300 p-8 text-center">
                      <p class="text-sm text-slate-500">Belum ada data nilai akademik yang tercatat.</p>
                    </div>
                  ` : `
                    <div class="overflow-x-auto">
                      <table class="w-full text-left border-collapse text-sm">
                        <thead>
                          <tr class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-600 uppercase">
                            ${!isSiswa ? '<th class="py-3 px-3">Nama Siswa</th>' : ''}
                            <th class="py-3 px-3">Mata Pelajaran</th>
                            <th class="py-3 px-3">Semester</th>
                            <th class="py-3 px-3">Tugas</th>
                            <th class="py-3 px-3">UTS</th>
                            <th class="py-3 px-3">UAS</th>
                            <th class="py-3 px-3">Rata-rata</th>
                            <th class="py-3 px-3">Predikat</th>
                            <th class="py-3 px-3">Catatan</th>
                            ${isGuruOrAdmin ? '<th class="py-3 px-3">Aksi</th>' : ''}
                          </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-200">
                          ${nilaiFiltered.map((n) => {
                            const siswaObj = state.pengguna.find((u) => u.id === n.siswa_id);
                            const rata = ((Number(n.nilai_tugas) + Number(n.nilai_uts) + Number(n.nilai_uas)) / 3).toFixed(1);
                            return `
                              <tr class="hover:bg-slate-50">
                                ${!isSiswa ? `<td class="py-3 px-3 font-bold text-slate-900">${escapeHTML(siswaObj ? siswaObj.nama_lengkap : 'Siswa')}</td>` : ''}
                                <td class="py-3 px-3 font-bold text-blue-800">${escapeHTML(n.mata_pelajaran)}</td>
                                <td class="py-3 px-3 text-slate-600">${escapeHTML(n.semester)}</td>
                                <td class="py-3 px-3">${escapeHTML(n.nilai_tugas)}</td>
                                <td class="py-3 px-3">${escapeHTML(n.nilai_uts)}</td>
                                <td class="py-3 px-3">${escapeHTML(n.nilai_uas)}</td>
                                <td class="py-3 px-3 font-bold text-slate-900">${rata}</td>
                                <td class="py-3 px-3">
                                  <span class="px-2.5 py-0.5 rounded bg-emerald-100 text-emerald-800 font-bold text-xs">${escapeHTML(n.predikat || hitungPredikat(rata))}</span>
                                </td>
                                <td class="py-3 px-3 text-xs text-slate-500">${escapeHTML(n.catatan_guru || '-')}</td>
                                ${isGuruOrAdmin ? `
                                  <td class="py-3 px-3">
                                    <button data-delete-nilai="${escapeHTML(n.id)}" class="text-xs text-rose-600 hover:underline">Hapus</button>
                                  </td>
                                ` : ''}
                              </tr>
                            `;
                          }).join('')}
                        </tbody>
                      </table>
                    </div>
                  `}
                </div>
              </div>
            `}
          ` : ''}
        </div>
      `;
    }

    // =========================================================================
    // HALAMAN PANEL ADMIN SEKOLAH
    // =========================================================================
    function renderAdmin() {

        return `

              <button data-open-login-admin class="px-6 py-2.5 rounded-lg bg-[#1E3A8A] hover:bg-blue-900 text-white text-sm font-bold">

            </div>
          </div>

        ? state.spmb

      return `

              { id: 'berita', label: `Berita & Galeri (${state.berita.length})` },
              { id: 'pengguna', label: `Akun Siswa & Guru (${state.pengguna.length})` },

                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">NPSN *</label>
                  <input name="npsn" value="${escapeHTML(state.profil.npsn)}" required class="w-full px-3.5 py-2.5 rounded-lg bg-white border border-slate-300 text-sm" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Status Akreditasi *</label>
                  <input name="akreditasi" value="${escapeHTML(state.profil.akreditasi)}" required class="w-full px-3.5 py-2.5 rounded-lg bg-white border border-slate-300 text-sm" />

                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Tahun Ajaran Aktif *</label>

                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Nama Kepala Sekolah *</label>
                  <input name="kepala_sekolah" value="${escapeHTML(state.profil.kepala_sekolah)}" required class="w-full px-3.5 py-2.5 rounded-lg bg-white border border-slate-300 text-sm" />

                </div>
                <div class="md:col-span-2">
                  <label class="block text-xs font-bold text-slate-700 mb-1">Alamat Lengkap Sekolah *</label>
                  <input name="alamat" value="${escapeHTML(state.profil.alamat)}" required class="w-full px-3.5 py-2.5 rounded-lg bg-white border border-slate-300 text-sm" />
                </div>
                <div class="md:col-span-2">
                  <label class="block text-xs font-bold text-slate-700 mb-1">Sambutan Kepala Sekolah</label>
                  <textarea name="sambutan_kepsek" rows="2" class="w-full px-3.5 py-2.5 rounded-lg bg-white border border-slate-300 text-sm">${escapeHTML(state.profil.sambutan_kepsek)}</textarea>

                  </button>
                </div>
              </form>
            </div>
          ` : ''}

          ${state.adminTab === 'spmb' ? `

                          <p class="text-xs text-slate-600">Asal SD: <strong>${escapeHTML(s.asal_sd)}</strong> • Nilai Rata-rata: <strong>${escapeHTML(s.nilai_rata_sd)}</strong> • WA Ortu: ${escapeHTML(s.no_hp_ortu)}</p>

                          Simpan Keputusan
                        </button>
                      </form>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>
          ` : ''}

          ${state.adminTab === 'berita' ? `
            <div class="space-y-5">
              <div class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm">

                  <div class="md:col-span-2">
                    <label class="block text-xs font-bold text-slate-700 mb-1">Isi Lengkap Artikel *</label>

                    <div>
                      <div class="flex items-center gap-2">

                        <span class="text-xs text-slate-400">${escapeHTML(b.tanggal_kegiatan || '')}</span>

                      <h4 class="text-sm font-bold text-slate-900 mt-1">${escapeHTML(b.judul)}</h4>

                    <button data-delete-berita="${escapeHTML(b.id)}" class="px-3 py-1.5 rounded bg-rose-50 text-rose-600 text-xs font-bold hover:bg-rose-100">Hapus</button>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}

          ${state.adminTab === 'pengguna' ? `
            <div class="space-y-5">
              <div class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm">
                <h2 class="text-lg font-bold text-[#1E3A8A] mb-1">Tambah Akun Siswa atau Guru Baru</h2>
                <p class="text-xs text-slate-500 mb-4">Akun ini digunakan untuk login pada Portal Akademik tanpa perlu verifikasi email.</p>
                <form id="form-admin-pengguna" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Peran *</label>
                    <select name="peran" class="w-full px-3 py-2 rounded-lg bg-white border border-slate-300 text-sm">
                      <option value="siswa">Siswa</option>
                      <option value="guru">Guru</option>
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">NISN (Siswa) / NIP (Guru) *</label>
                    <input name="username" required placeholder="Contoh: 0098765432" class="w-full px-3 py-2 rounded-lg bg-white border border-slate-300 text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Password Login *</label>
                    <input name="password" required placeholder="Password awal" class="w-full px-3 py-2 rounded-lg bg-white border border-slate-300 text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Nama Lengkap *</label>
                    <input name="nama_lengkap" required placeholder="Nama lengkap & gelar" class="w-full px-3 py-2 rounded-lg bg-white border border-slate-300 text-sm" />

                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Kelas (Siswa) / Mapel (Guru) *</label>

                  <div class="sm:col-span-2 lg:col-span-5 flex justify-end pt-1">
                    <button type="submit" class="px-5 py-2.5 rounded-lg bg-[#1E3A8A] hover:bg-blue-900 text-white text-xs font-bold">
                      Daftarkan Akun
                    </button>
                  </div>
                </form>
              </div>

              <div class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm space-y-3">
                <h3 class="text-base font-bold text-[#1E3A8A]">Daftar Akun Warga Sekolah</h3>

          ${state.adminTab === 'akademik' ? `

                <form id="form-admin-jadwal" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">

                      <option value="Selasa">Selasa</option>
                      <option value="Rabu">Rabu</option>
                      <option value="Kamis">Kamis</option>
                      <option value="Jumat">Jumat</option>
                      <option value="Sabtu">Sabtu</option>

                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Jam Pelajaran *</label>

                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Mata Pelajaran *</label>

                  </div>

                    <label class="block text-xs font-bold text-slate-700 mb-1">Nama Guru Pengampu *</label>
                    <input name="nama_guru" required placeholder="Nama guru..." class="w-full px-3 py-2 rounded-lg bg-white border border-slate-300 text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Ruang Kelas / Keterangan</label>
                    <input name="deskripsi_atau_link" placeholder="Ruang VII-B" class="w-full px-3 py-2 rounded-lg bg-white border border-slate-300 text-sm" />
                  </div>
                  <div class="sm:col-span-2 lg:col-span-3 flex justify-end">
                    <button type="submit" class="px-5 py-2.5 rounded-lg bg-[#1E3A8A] hover:bg-blue-900 text-white text-xs font-bold">

              <div class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm space-y-3">
                <h3 class="text-base font-bold text-[#1E3A8A]">Semua Jadwal & Materi Tercatat</h3>
                ${state.jadwal_materi.length === 0 ? `
                  <p class="text-sm text-slate-500">Belum ada data jadwal atau materi.</p>
                ` : state.jadwal_materi.map((jm) => `
                  <div class="rounded-lg bg-slate-50 border border-slate-200 p-3.5 flex items-center justify-between gap-3">
                    <div>
                      <span class="px-2 py-0.5 rounded bg-blue-100 text-blue-800 text-xs font-bold mr-1.5">${escapeHTML(jm.tipe)} • Kelas ${escapeHTML(jm.kelas)}</span>
                      <span class="text-xs text-slate-500">${escapeHTML(jm.hari || '')} (${escapeHTML(jm.jam_pelajaran || '')})</span>

    // =========================================================================
    // MODALS (DETAIL BERITA & LOGIN HYBRID)
    // =========================================================================
    function renderModals() {
      let html = '';

      if (state.selectedBeritaModal) {
        const b = state.selectedBeritaModal;
        html += `
          <div class="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4">
            <div class="bg-white rounded-xl max-w-2xl w-full max-h-[88vh] overflow-y-auto p-6 md:p-8 shadow-2xl space-y-4">
              <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-2">
                  ${renderKategoriBadge(b.kategori)}
                  <span class="text-xs text-slate-500">${escapeHTML(formatTanggalIndo(b.tanggal_kegiatan))}</span>
                </div>
                <button data-close-berita class="p-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700">
                  <i data-lucide="x" class="w-4 h-4"></i>
                </button>
              </div>
              <h2 class="text-xl md:text-2xl font-extrabold text-[#1E3A8A] leading-snug">${escapeHTML(b.judul)}</h2>

              <p class="text-sm text-slate-700 whitespace-pre-line leading-relaxed">${escapeHTML(b.isi_konten || b.ringkasan)}</p>
              <div class="pt-3 border-t border-slate-200 flex items-center justify-between text-xs text-slate-500">
                <span>Diterbitkan oleh: ${escapeHTML(b.penulis || 'Admin Sekolah')}</span>
                <button data-close-berita class="px-4 py-2 rounded-lg bg-[#1E3A8A] text-white font-bold">Tutup</button>
              </div>
            </div>
          </div>

      if (state.showLoginModal) {
        html += `
          <div class="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4">
            <div class="bg-white rounded-xl max-w-md w-full p-6 md:p-7 shadow-2xl space-y-5">
              <div class="flex items-center justify-between border-b border-slate-200 pb-3">
                <div>
                  <h2 class="text-lg font-extrabold text-[#1E3A8A]">Masuk Portal Sekolah</h2>
                  <p class="text-xs text-slate-500">Pilih peran akun Anda untuk melanjutkan</p>
                </div>
                <button data-close-login class="p-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700">
                  <i data-lucide="x" class="w-4 h-4"></i>
                </button>
              </div>

              <div class="grid grid-cols-2 gap-1.5 p-1 rounded-lg bg-slate-100">
                <button data-login-tab="warga" class="py-2 rounded text-xs font-bold transition ${
                  state.loginTab === 'warga' ? 'bg-[#1E3A8A] text-white' : 'text-slate-600'
                }">
                  Siswa & Guru
                </button>
                <button data-login-tab="admin" class="py-2 rounded text-xs font-bold transition ${
                  state.loginTab === 'admin' ? 'bg-[#1E3A8A] text-white' : 'text-slate-600'
                }">
                  Admin Sekolah
                </button>
              </div>

              ${state.loginTab === 'warga' ? `
                <form id="form-login-warga" class="space-y-3.5">
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">NISN (Siswa) atau NIP/Kode (Guru)</label>
                    <input name="username" required placeholder="Masukkan NISN atau NIP..." class="w-full px-3.5 py-2.5 rounded-lg bg-white border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Password</label>
                    <input name="password" type="password" required placeholder="••••••••" class="w-full px-3.5 py-2.5 rounded-lg bg-white border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
                  </div>
                  <button type="submit" class="w-full py-2.5 rounded-lg bg-[#1E3A8A] hover:bg-blue-900 text-white font-bold text-sm transition">
                    Masuk ke Portal Akademik
                  </button>
                </form>

                ${IS_PREVIEW ? `
                  <div class="pt-3 border-t border-slate-200 space-y-2">
                    <div class="text-[11px] font-bold text-amber-700 uppercase">Quick Login (Mode Preview):</div>
                    <div class="grid grid-cols-2 gap-2">
                      <button data-quick-login="siswa" class="py-2 px-3 rounded-lg bg-amber-50 hover:bg-amber-100 border border-amber-300 text-amber-900 text-xs font-bold">
                        Coba Siswa (Ananda)
                      </button>
                      <button data-quick-login="guru" class="py-2 px-3 rounded-lg bg-sky-50 hover:bg-sky-100 border border-sky-300 text-sky-900 text-xs font-bold">
                        Coba Guru (Pak Budi)
                      </button>
                    </div>
                  </div>
                ` : ''}
              ` : `
                <form id="form-login-admin" class="space-y-3.5">
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Email Administrator</label>
                    <input name="email" type="email" required placeholder="admin@sekolah.sch.id" class="w-full px-3.5 py-2.5 rounded-lg bg-white border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Password Admin</label>
                    <input name="password" type="password" required placeholder="••••••••" class="w-full px-3.5 py-2.5 rounded-lg bg-white border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
                  </div>
                  <button type="submit" class="w-full py-2.5 rounded-lg bg-[#1E3A8A] hover:bg-blue-900 text-white font-bold text-sm transition">
                    Masuk Panel Admin
                  </button>
                </form>

                ${IS_PREVIEW ? `
                  <div class="pt-3 border-t border-slate-200">
                    <button data-quick-login="admin" class="w-full py-2 px-3 rounded-lg bg-amber-50 hover:bg-amber-100 border border-amber-300 text-amber-900 text-xs font-bold">
                      Quick Login Admin (Mode Preview)
                    </button>
                  </div>
                ` : ''}
              `}
            </div>
          </div>
        `;
      }

      return html;
    }

    // =========================================================================
    // RENDER UTAMA (TOP BAR + MAIN NAVBAR + CONTENT + FOOTER)
    // =========================================================================
    function render() {
      const root = document.getElementById('smp-app-root');
      if (!root) return;

      const topNavItems = [
        { id: 'beranda', label: 'Beranda', sub: 'Home' },
        { id: 'profil', label: 'Tentang Kami', sub: 'Profil & Guru' },
        { id: 'spmb', label: 'Pendaftaran', sub: 'SPMB Online' },
        { id: 'akademik', label: 'Akademik', sub: 'E-Learning & Nilai' },
        { id: 'berita', label: 'Info Terbaru', sub: 'Berita & Galeri' }
      ];

      if (state.currentUser?.role === 'admin') {
        topNavItems.push({ id: 'admin', label: 'Panel Admin', sub: 'Kelola Web' });
      }

      let activeContent = '';
      if (state.activeMenu === 'beranda') activeContent = renderBeranda();
      else if (state.activeMenu === 'profil') activeContent = renderProfil();
      else if (state.activeMenu === 'berita') activeContent = renderBerita();
      else if (state.activeMenu === 'spmb') activeContent = renderSpmb();
      else if (state.activeMenu === 'akademik') activeContent = renderAkademik();
      else if (state.activeMenu === 'admin') activeContent = renderAdmin();

      root.innerHTML = `
        <div class="min-h-screen flex flex-col">
          <!-- Banner Mode Preview (Hanya tampil saat IS_PREVIEW === true) -->
          ${IS_PREVIEW ? `
            <div class="bg-amber-500 text-slate-950 px-4 py-1.5 text-xs font-bold flex flex-wrap items-center justify-between gap-2 z-40">
              <div class="flex items-center gap-2">
                <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
                <span>Mode Preview Aktif — Data simulasi lokal.</span>
              </div>
              <div class="flex items-center gap-2">
                <button data-quick-login="admin" class="underline hover:text-white">Quick Admin</button>
                <span>•</span>
                <button data-quick-login="guru" class="underline hover:text-white">Quick Guru</button>
                <span>•</span>
                <button data-quick-login="siswa" class="underline hover:text-white">Quick Siswa</button>
              </div>
            </div>
          ` : ''}

          <!-- 1. TOP UTILITY BAR BIRU CERAH (MIRIP GAMBAR REFERENSI) -->
          <div class="bg-[#0095D9] text-white text-[11px] sm:text-xs py-1.5 px-4 border-b border-sky-400/40">
            <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center gap-4 overflow-x-auto whitespace-nowrap">
                <button data-nav="spmb" class="hover:underline uppercase font-semibold">Info SPMB</button>
                <button data-nav="profil" class="hover:underline uppercase font-semibold hidden sm:inline">TENTANG KAMI</button>
                <button data-nav="berita" class="hover:underline font-semibold">PENGUMUMAN</button>
              </div>
              <div class="flex items-center gap-3">
                ${state.loading ? `<span class="text-amber-200 font-semibold">Memuat data...</span>` : ''}
                <button id="btn-install-pwa" class="inline-flex items-center gap-1 bg-white/15 hover:bg-white/25 px-2.5 py-0.5 rounded font-semibold transition">
                  <i data-lucide="download" class="w-3 h-3"></i>
                  <span>Install App</span>
                </button>
              </div>
            </div>
          </div>

          <!-- 2. MAIN TOP NAVIGATION BAR BIRU TUA NAVY (MENU ADA DI BAGIAN ATAS!) -->
          <header class="sticky top-0 z-30 bg-[#1E3A8A] text-white shadow-md">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div class="flex items-center justify-between h-16 md:h-20 gap-4">
                <!-- Logo & Nama Sekolah -->
                <button data-nav="beranda" class="flex items-center gap-3 text-left min-w-0 group">
                  <div class="w-10 h-10 md:w-12 md:h-12 rounded-xl bg-white text-[#1E3A8A] flex items-center justify-center font-extrabold text-sm md:text-base shadow shrink-0 border-2 border-sky-300">
                    SMP
                  </div>
                  <div class="min-w-0">
                    <div class="text-sm sm:text-base md:text-lg font-extrabold tracking-wide uppercase truncate font-heading group-hover:text-amber-300 transition">
                      ${escapeHTML(state.profil.nama_sekolah)}
                    </div>
                    <div class="text-[10px] sm:text-[11px] text-sky-200 truncate">
                      Berakar Di Desa • Berpikir Mendunia
                    </div>
                  </div>
                </button>

                <!-- Menu Horizontal Atas Desktop (Dengan Subjudul Bilingual ala Gambar Referensi) -->
                <nav class="hidden lg:flex items-center gap-1">
                  ${topNavItems.map((item) => `
                    <button data-nav="${item.id}" class="px-3.5 py-2 rounded text-left transition border-b-2 ${
                      state.activeMenu === item.id
                        ? 'bg-blue-900/90 border-amber-400 text-white'
                        : 'border-transparent text-blue-100 hover:bg-blue-900/50 hover:text-white'
                    }">
                      <div class="text-xs font-bold leading-tight">${item.label}</div>
                      <div class="text-[10px] text-sky-300 leading-tight mt-0.5">${item.sub}</div>
                    </button>
                  `).join('')}
                </nav>

                <!-- Tombol Masuk / Profil Akun & Hamburger Mobile -->
                <div class="flex items-center gap-2 shrink-0">
                  ${state.currentUser ? `
                    <div class="hidden sm:flex items-center gap-2 bg-blue-950/70 border border-blue-700 px-3 py-1.5 rounded-lg">
                      <div class="text-right">
                        <div class="text-xs font-bold text-white max-w-[120px] truncate">${escapeHTML(state.currentUser.nama_lengkap)}</div>
                        <div class="text-[10px] text-amber-300 uppercase font-bold">${escapeHTML(state.currentUser.role)}</div>
                      </div>
                      <button data-logout class="px-2.5 py-1 rounded bg-rose-600 hover:bg-rose-700 text-white text-[11px] font-bold">
                        Keluar
                      </button>
                    </div>
                  ` : `
                    <button data-open-login class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded bg-[#0095D9] hover:bg-sky-500 text-white text-xs font-bold shadow-sm transition">
                      <i data-lucide="log-in" class="w-3.5 h-3.5"></i>
                      <span>Masuk Portal</span>
                    </button>
                  `}

                  <!-- Tombol Menu Mobile -->
                  <button id="btn-toggle-mobile-menu" aria-label="Buka Menu" class="lg:hidden p-2 rounded bg-blue-900 hover:bg-blue-800 text-white">
                    <i data-lucide="${state.mobileMenuOpen ? 'x' : 'menu'}" class="w-5 h-5"></i>
                  </button>
                </div>
              </div>
            </div>

            <!-- Dropdown Menu Mobile (Saat dibuka di layar HP/Tablet) -->
            ${state.mobileMenuOpen ? `
              <div class="lg:hidden bg-[#172D6B] border-t border-blue-800 px-4 py-3 space-y-1.5">
                ${topNavItems.map((item) => `
                  <button data-nav="${item.id}" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded text-left ${
                    state.activeMenu === item.id
                      ? 'bg-[#0095D9] text-white font-bold'
                      : 'text-blue-100 hover:bg-blue-900'
                  }">
                    <span class="text-sm font-semibold">${item.label}</span>
                    <span class="text-xs text-sky-200">${item.sub}</span>
                  </button>
                `).join('')}
                ${state.currentUser ? `
                  <div class="pt-2 border-t border-blue-800 flex items-center justify-between px-2">
                    <span class="text-xs text-sky-200">${escapeHTML(state.currentUser.nama_lengkap)} (${escapeHTML(state.currentUser.role)})</span>
                    <button data-logout class="px-3 py-1.5 rounded bg-rose-600 text-white text-xs font-bold">Keluar</button>
                  </div>
                ` : ''}
              </div>
            ` : ''}
          </header>

          <!-- 3. KONTEN UTAMA -->
          <main class="flex-1 bg-white">
            ${activeContent}
          </main>

          <!-- 4. FOOTER RESMI SEKOLAH -->
          <footer class="bg-[#0B1120] text-slate-400 text-xs py-6 px-4 border-t border-slate-800">
            <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3 text-center sm:text-left">
              <div>
                <span class="text-white font-bold">${escapeHTML(state.profil.nama_sekolah)}</span> — ${escapeHTML(state.profil.alamat)}
              </div>
              <div>
                &copy; ${new Date().getFullYear()} Tim IT Spenpatko
              </div>
            </div>
          </footer>
        </div>

        <!-- Toast Notification -->
        ${state.toast ? `
          <div class="fixed bottom-5 right-5 z-[60] max-w-sm px-4 py-3 rounded-lg shadow-xl border text-xs font-bold flex items-center gap-2.5 ${
            state.toast.type === 'error'
              ? 'bg-rose-600 text-white border-rose-500'
              : 'bg-slate-900 text-white border-slate-700'
          }">
            <i data-lucide="${state.toast.type === 'error' ? 'alert-circle' : 'check-circle'}" class="w-4 h-4 shrink-0"></i>
            <span>${escapeHTML(state.toast.message)}</span>
          </div>
        ` : ''}

        ${renderModals()}
      `;

      // Pasang hover pause pada Hero Carousel agar nyaman dibaca saat kursor diarahkan
      const carouselEl = document.getElementById('hero-carousel-wrapper');
      if (carouselEl) {
        carouselEl.onmouseenter = () => { state.isCarouselPaused = true; };
        carouselEl.onmouseleave = () => { state.isCarouselPaused = false; };
      }

      if (window.lucide) {
        window.lucide.createIcons();
      }
    }

    // =========================================================================
    // EVENT DELEGATION & INTERAKSI PENGGUNA
    // =========================================================================
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      state.deferredInstallPrompt = e;
    });

    document.addEventListener('click', async (e) => {
      const target = e.target.closest('button, [data-nav], [data-open-berita]');
      if (!target) return;

      // Kontrol Carousel Slide Manual
      if (target.id === 'btn-prev-slide') {
        goToSlide(state.currentSlide - 1);
        return;
      }
      if (target.id === 'btn-next-slide') {
        goToSlide(state.currentSlide + 1);
        return;
      }
      if (target.dataset.slideDot !== undefined) {
        goToSlide(Number(target.dataset.slideDot));
        return;
      }

      // Toggle Menu Mobile
      if (target.id === 'btn-toggle-mobile-menu') {
        state.mobileMenuOpen = !state.mobileMenuOpen;
        render();
        return;
      }

      // Navigasi Menu Utama
      if (target.dataset.nav) {
        state.activeMenu = target.dataset.nav;
        state.mobileMenuOpen = false;
        const root = document.getElementById('smp-app-root');
        if (root) root.scrollTop = 0;
        render();
        return;
      }

      // Install PWA
      if (target.id === 'btn-install-pwa') {
        if (state.deferredInstallPrompt) {
          state.deferredInstallPrompt.prompt();
          await state.deferredInstallPrompt.userChoice;
          state.deferredInstallPrompt = null;
        } else {
          showToast('Untuk menginstal: klik menu browser (⋮) lalu pilih "Tambahkan ke Layar Utama / Install App".');
        }
        return;
      }

      // Login & Logout
      if (target.dataset.openLogin !== undefined) {
        state.showLoginModal = true;
        state.loginTab = 'warga';
        render();
        return;
      }
      if (target.dataset.openLoginAdmin !== undefined) {
        state.showLoginModal = true;
        state.loginTab = 'admin';
        render();
        return;
      }
      if (target.dataset.closeLogin !== undefined) {
        state.showLoginModal = false;
        render();
        return;
      }
      if (target.dataset.loginTab) {
        state.loginTab = target.dataset.loginTab;
        render();
        return;
      }
      if (target.dataset.logout !== undefined) {
        await handleLogout();
        return;
      }

      // Quick Login (Hanya berjalan jika IS_PREVIEW === true)
      if (target.dataset.quickLogin && IS_PREVIEW) {
        const role = target.dataset.quickLogin;
        if (role === 'admin') {
          await handleAdminLogin('admin@smp.sch.id', 'preview');
        } else if (role === 'guru') {
          await handleWargaLogin('1985041201', '123');
        } else if (role === 'siswa') {
          await handleWargaLogin('0098765432', '123');
        }
        return;
      }

      // Filter Berita & Modal Baca Berita
      if (target.dataset.filterBerita) {
        state.beritaFilter = target.dataset.filterBerita;
        render();
        return;
      }
      if (target.dataset.openBerita) {
        state.selectedBeritaModal = state.berita.find((b) => b.id === target.dataset.openBerita) || null;
        render();
        return;
      }
      if (target.dataset.closeBerita !== undefined) {
        state.selectedBeritaModal = null;
        render();
        return;
      }

      // Tab SPMB
      if (target.dataset.spmbTab) {
        state.spmbTab = target.dataset.spmbTab;
        render();
        return;
      }
      if (target.dataset.closeReceipt !== undefined) {
        state.lastSpmbReceipt = null;
        render();
        return;
      }

      // Tab & Filter Akademik
      if (target.dataset.akademikTab) {
        state.akademikTab = target.dataset.akademikTab;
        render();
        return;
      }
      if (target.dataset.kelasFilter) {
        state.kelasFilter = target.dataset.kelasFilter;
        render();
        return;
      }

      // Tab & Filter Admin
      if (target.dataset.adminTab) {
        state.adminTab = target.dataset.adminTab;
        render();
        return;
      }
      if (target.dataset.adminSpmbFilter) {
        state.adminSpmbFilter = target.dataset.adminSpmbFilter;
        render();
        return;
      }

      // Aksi Hapus & Toggle
      if (target.dataset.deleteSpmb) {
        await deleteSpmb(target.dataset.deleteSpmb);
        return;
      }
      if (target.dataset.deleteBerita) {
        await deleteBerita(target.dataset.deleteBerita);
        return;
      }
      if (target.dataset.toggleUser) {
        const isAktif = target.dataset.currentAktif === 'true';
        await toggleAktifPengguna(target.dataset.toggleUser, isAktif);
        return;
      }
      if (target.dataset.deleteUser) {
        await deletePengguna(target.dataset.deleteUser);
        return;
      }
      if (target.dataset.deleteJm) {
        await deleteJadwalMateri(target.dataset.deleteJm);
        return;
      }
      if (target.dataset.deleteNilai) {
        await deleteNilaiAkademik(target.dataset.deleteNilai);
        return;
      }
    });

    // Pencarian Real-time
    document.addEventListener('input', (e) => {
      if (e.target.id === 'input-search-guru') {
        state.guruSearch = e.target.value;
        render();
        const el = document.getElementById('input-search-guru');
        if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      }
      if (e.target.id === 'input-search-berita') {
        state.beritaSearch = e.target.value;
        render();
        const el = document.getElementById('input-search-berita');
        if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      }
    });

    // Penanganan Semua Form Submit
    document.addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const fd = new FormData(form);

      if (form.id === 'form-login-admin') {
        await handleAdminLogin(fd.get('email'), fd.get('password'));
      } else if (form.id === 'form-login-warga') {
        await handleWargaLogin(fd.get('username'), fd.get('password'));
      } else if (form.id === 'form-spmb') {
        await submitPendaftaranSpmb({
          nisn: fd.get('nisn'),
          nama_lengkap: fd.get('nama_lengkap'),
          jenis_kelamin: fd.get('jenis_kelamin'),
          asal_sd: fd.get('asal_sd'),
          jalur_pendaftaran: fd.get('jalur_pendaftaran'),
          nilai_rata_sd: fd.get('nilai_rata_sd'),
          no_hp_ortu: fd.get('no_hp_ortu'),
          alamat: fd.get('alamat')
        });
        form.reset();
      } else if (form.id === 'form-cek-spmb') {
        state.spmbCekQuery = fd.get('query');
        await cekStatusSpmb(state.spmbCekQuery);
      } else if (form.id === 'form-admin-profil') {
        await saveProfilSekolah({
          nama_sekolah: fd.get('nama_sekolah'),
          npsn: fd.get('npsn'),
          akreditasi: fd.get('akreditasi'),
          tahun_ajaran: fd.get('tahun_ajaran'),
          kepala_sekolah: fd.get('kepala_sekolah'),
          status_spmb: fd.get('status_spmb') === 'true',
          alamat: fd.get('alamat'),
          sambutan_kepsek: fd.get('sambutan_kepsek'),
          visi: fd.get('visi'),
          misi: fd.get('misi')
        });
      } else if (form.dataset.updateSpmbForm) {
        await updateStatusSpmb(
          form.dataset.updateSpmbForm,
          fd.get('status_seleksi'),
          fd.get('catatan_admin')
        );
      } else if (form.id === 'form-admin-berita') {
        await addBerita({
          judul: fd.get('judul'),
          kategori: fd.get('kategori'),
          tanggal_kegiatan: fd.get('tanggal_kegiatan'),
          gambar_url: fd.get('gambar_url'),
          ringkasan: fd.get('ringkasan'),
          isi_konten: fd.get('isi_konten'),
          penulis: state.currentUser?.nama_lengkap || 'Admin Sekolah'
        });
        form.reset();
      } else if (form.id === 'form-admin-pengguna') {
        await addPengguna({
          peran: fd.get('peran'),
          username: fd.get('username').trim(),
          password: fd.get('password').trim(),
          nama_lengkap: fd.get('nama_lengkap').trim(),
          kelas_atau_mapel: fd.get('kelas_atau_mapel').trim()
        });
        form.reset();
      } else if (form.id === 'form-admin-jadwal') {
        await addJadwalMateri({
          tipe: 'Jadwal',
          kelas: fd.get('kelas'),
          hari: fd.get('hari'),
          jam_pelajaran: fd.get('jam_pelajaran'),
          mata_pelajaran: fd.get('mata_pelajaran'),
          nama_guru: fd.get('nama_guru'),
          judul_materi: fd.get('mata_pelajaran'),
          deskripsi_atau_link: fd.get('deskripsi_atau_link')
        });
        form.reset();
      } else if (form.id === 'form-tambah-materi') {
        await addJadwalMateri({
          tipe: 'Materi',
          kelas: fd.get('kelas'),
          hari: '-',
          jam_pelajaran: 'E-Learning',
          mata_pelajaran: fd.get('mata_pelajaran'),
          nama_guru: state.currentUser?.nama_lengkap || 'Guru',
          judul_materi: fd.get('judul_materi'),
          deskripsi_atau_link: fd.get('deskripsi_atau_link')
        });
        form.reset();
      } else if (form.id === 'form-input-nilai') {
        await saveNilaiAkademik({
          siswa_id: fd.get('siswa_id'),
          mata_pelajaran: fd.get('mata_pelajaran'),
          semester: fd.get('semester'),
          nilai_tugas: fd.get('nilai_tugas'),
          nilai_uts: fd.get('nilai_uts'),
          nilai_uas: fd.get('nilai_uas'),
          catatan_guru: fd.get('catatan_guru')
        });
        form.reset();
      }
    });

    // Inisialisasi Aplikasi Pertama Kali
    render();
    if (!IS_PREVIEW) {
      loadAllSupabaseData();
    }
  </script>
</body>
</html>
