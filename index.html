      const accessTime = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + ' WIB';

    // =========================================================================

    // =========================================================================
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function compressImageToDataUrl(file, maxWidth = 800, quality = 0.78) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    window.showToast = function (message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      const bgClass =
        type === 'error'
          ? 'bg-red-600 text-white'
          : type === 'warning'
            ? 'bg-amber-500 text-white'
            : 'bg-slate-900 text-white';
      toast.className = `pointer-events-auto px-4 py-3 rounded-2xl shadow-lg text-xs font-medium flex items-center gap-2.5 animate-view ${bgClass}`;
      toast.innerHTML = `<i data-lucide="${
        type === 'error' ? 'alert-circle' : 'check-circle-2'
      }" class="w-4 h-4 shrink-0"></i><span>${escapeHtml(message)}</span>`;
      container.appendChild(toast);
      if (window.lucide) window.lucide.createIcons();
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.25s ease';
        setTimeout(() => toast.remove(), 260);
      }, 3200);
    };

    function showConfirmDialog(title, message, onConfirm) {
      const modal = document.getElementById('confirm-modal');
      document.getElementById('confirm-title').textContent = title;
      document.getElementById('confirm-message').textContent = message;
      modal.classList.remove('hidden');
      modal.classList.add('flex');

      const cancelBtn = document.getElementById('confirm-cancel-btn');
      const okBtn = document.getElementById('confirm-ok-btn');

      const close = () => {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      };

      cancelBtn.onclick = close;
      okBtn.onclick = () => {
        close();
        onConfirm();
      };
    }

      event.preventDefault();
      const title = document.getElementById('slide-title').value.trim();
      const subtitle = document.getElementById('slide-subtitle').value.trim();
      const fileInput = document.getElementById('slide-image-file');
      const urlInput = document.getElementById('slide-image-url').value.trim();

          const compressed = await compressImageToDataUrl(files[i], 1080, 0.78);
          slidesToCreate.push({
            title: files.length > 1 ? `${title} (${i + 1})` : title,
            subtitle,
            imageUrl: compressed,
            order: state.heroSlides.length + i + 1,
            isActive: true

      } else {
        slidesToCreate.push({
          title,
          subtitle,
          imageUrl: urlInput || DEFAULT_SLIDE_SVG_1,
          order: state.heroSlides.length + 1,
          isActive: true

      try {
        for (let i = 0; i < slidesToCreate.length; i++) {
          const item = slidesToCreate[i];

            state.heroSlides.push({ id: `slide-${Date.now()}-${i}`, ...item });

    window.previewAnnouncementPhotos = function (inputEl) {
      const previewEl = document.getElementById('ann-photos-preview');
      if (!previewEl) return;
      const files = inputEl.files ? Array.from(inputEl.files) : [];
      if (files.length === 0) {
        previewEl.innerHTML = '';

      }
      previewEl.innerHTML = files
        .map((file, idx) => {

          return `
            <div class="relative h-20 rounded-xl overflow-hidden border border-slate-200 bg-slate-100">
              <img src="${blobUrl}" alt="Foto ${idx + 1}" class="w-full h-full object-cover" />

            </div>
          `;
        })
        .join('');
    };

    window.appendAnnouncementPhotos = async function (annId, inputEl) {
      const files = inputEl.files ? Array.from(inputEl.files) : [];
      if (files.length === 0) return;

      try {
        const compressedList = [];
        for (const file of files) {
          const dataUrl = await compressImageToDataUrl(file, 900, 0.75);
          compressedList.push(dataUrl);
        }

        const target = state.announcements.find((a) => a.id === annId);
        const existingPhotos = Array.isArray(target?.photos) ? target.photos : [];
        const updatedPhotos = [...existingPhotos, ...compressedList];

        if (IS_PREVIEW) {
          if (target) target.photos = updatedPhotos;
        } else {
          await updateDoc(doc(db, 'announcements', annId), { photos: updatedPhotos });
        }

        showToast(`${compressedList.length} foto slide ditambahkan ke pengumuman!`);
        renderApp();
      } catch (err) {
        showToast('Gagal mengunggah foto tambahan: ' + err.message, 'error');
      }
    };

    // =========================================================================
    // RENDER NAVIGASI ATAS (DESKTOP) & MENU RESPONSIF (HP / TABLET)
    // =========================================================================
    function renderNavigation() {
      const baseMenus = [
        { id: 'home', label: 'Beranda', icon: 'home' },
        { id: 'teachers', label: 'Profil Guru', icon: 'users' },
        { id: 'spmb', label: 'SPMB Online', icon: 'user-plus' },
        { id: 'info', label: 'Informasi', icon: 'bell' }
      ];

      const dynamicMenus = state.customMenus.map((m) => ({
        id: `custom:${m.id}`,
        label: m.title,
        icon: m.icon || 'folder-open'
      }));

      const allMenus = [...baseMenus, ...dynamicMenus];

      // 1. Desktop Top Nav
      const desktopNavEl = document.getElementById('top-desktop-nav');
      if (desktopNavEl) {
        desktopNavEl.innerHTML = allMenus
          .map((item) => {
            const active = state.currentRoute === item.id;
            return `
              <button
                onclick="navigateTo('${item.id}')"
                class="px-3.5 py-2 rounded-xl text-xs xl:text-sm font-semibold flex items-center gap-2 transition-all ${
                  active
                    ? 'bg-blue-600 text-white shadow-xs'
                    : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'
                }"
              >
                <i data-lucide="${escapeHtml(item.icon)}" class="w-4 h-4"></i>
                <span>${escapeHtml(item.label)}</span>
              </button>
            `;
          })
          .join('');
      }

      // 2. Desktop Auth / Admin Button
      const desktopAuthEl = document.getElementById('top-desktop-auth');
      if (desktopAuthEl) {
        if (state.authUser) {
          desktopAuthEl.innerHTML = `
            <button onclick="navigateTo('admin')" class="px-3.5 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition ${
              state.currentRoute === 'admin'
                ? 'bg-blue-900 text-white'
                : 'bg-blue-50 text-blue-800 hover:bg-blue-100'
            }">
              <i data-lucide="shield-check" class="w-4 h-4"></i> Panel Admin
            </button>
            <button onclick="handleLogout()" title="Keluar" class="p-2 rounded-xl bg-red-50 text-red-600 hover:bg-red-100 transition">
              <i data-lucide="log-out" class="w-4 h-4"></i>
            </button>
          `;
        } else if (state.schoolUser) {
          desktopAuthEl.innerHTML = `
            <button onclick="navigateTo('info'); setInfoTab('internal')" class="px-3.5 py-2 rounded-xl bg-teal-50 text-teal-800 text-xs font-semibold flex items-center gap-1.5">
              <i data-lucide="user-check" class="w-4 h-4"></i> ${escapeHtml(state.schoolUser.fullName.split(' ')[0])}
            </button>
            <button onclick="handleLogout()" title="Keluar" class="p-2 rounded-xl bg-red-50 text-red-600 hover:bg-red-100 transition">
              <i data-lucide="log-out" class="w-4 h-4"></i>
            </button>
          `;
        } else {
          desktopAuthEl.innerHTML = `
            <button onclick="navigateTo('auth')" class="px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold flex items-center gap-2 shadow-xs transition active:scale-95">
              <i data-lucide="log-in" class="w-4 h-4"></i> Masuk / Admin
            </button>
          `;
        }
      }

      // 3. Mobile / Tablet Quick Button & Hamburger Drawer
      const quickBtn = document.getElementById('mobile-header-quick-btn');
      const quickLabel = document.getElementById('mobile-header-quick-label');
      if (quickBtn && quickLabel) {
        if (state.authUser) {
          quickBtn.onclick = () => navigateTo('admin');
          quickLabel.textContent = 'Admin';
        } else if (state.schoolUser) {
          quickBtn.onclick = () => {
            navigateTo('info');
            setInfoTab('internal');
          };
          quickLabel.textContent = 'Warga';
        } else {
          quickBtn.onclick = () => navigateTo('auth');
          quickLabel.textContent = 'Masuk';
        }
      }

      const mobileMenuBox = document.getElementById('responsive-mobile-menu');
      const mobileMenuIcon = document.getElementById('mobile-menu-icon');
      const mobilePanelContent = document.getElementById('mobile-nav-panel-content');

      if (mobileMenuBox && mobileMenuIcon && mobilePanelContent) {
        if (state.mobileMenuOpen) {
          mobileMenuBox.classList.remove('hidden');
          mobileMenuIcon.setAttribute('data-lucide', 'x');
        } else {
          mobileMenuBox.classList.add('hidden');
          mobileMenuIcon.setAttribute('data-lucide', 'menu');
        }

        mobilePanelContent.innerHTML = `
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            ${allMenus
              .map((item) => {
                const active = state.currentRoute === item.id;
                return `
                  <button
                    onclick="navigateTo('${item.id}')"
                    class="w-full px-4 py-3 rounded-2xl text-sm font-semibold flex items-center gap-3 transition ${
                      active
                        ? 'bg-blue-600 text-white shadow-xs'

                    }"
                  >
                    <i data-lucide="${escapeHtml(item.icon)}" class="w-4 h-4 shrink-0"></i>
                    <span class="truncate">${escapeHtml(item.label)}</span>
                  </button>
                `;
              })
              .join('')}
          </div>
          <div class="pt-3 border-t border-slate-200/80 flex flex-wrap items-center justify-between gap-2">
            ${
              state.authUser
                ? `
                  <button onclick="navigateTo('admin')" class="flex-1 px-4 py-2.5 rounded-xl bg-blue-900 text-white text-xs font-semibold flex items-center justify-center gap-2">
                    <i data-lucide="shield-check" class="w-4 h-4"></i> Buka Panel Admin
                  </button>
                  <button onclick="handleLogout()" class="px-4 py-2.5 rounded-xl bg-red-50 text-red-600 text-xs font-semibold flex items-center gap-1.5">
                    <i data-lucide="log-out" class="w-4 h-4"></i> Keluar
                  </button>
                `
                : state.schoolUser
                  ? `
                    <span class="text-xs font-semibold text-teal-700">Masuk sebagai: ${escapeHtml(state.schoolUser.fullName)}</span>
                    <button onclick="handleLogout()" class="px-4 py-2 rounded-xl bg-red-50 text-red-600 text-xs font-semibold">Keluar</button>
                  `
                  : `
                    <button onclick="navigateTo('auth')" class="w-full px-4 py-3 rounded-xl bg-blue-600 text-white text-xs font-semibold flex items-center justify-center gap-2">
                      <i data-lucide="log-in" class="w-4 h-4"></i> Login Warga Sekolah / Admin
                    </button>

            }
          </div>
        `;
      }

      if (window.lucide) window.lucide.createIcons();
    }

    // =========================================================================

    function renderHeroSliderInner() {
      const activeSlides = state.heroSlides.filter((s) => s.isActive !== false);
      if (activeSlides.length === 0) {
        return `
          <div class="relative h-64 sm:h-80 md:h-[380px] rounded-3xl overflow-hidden bg-gradient-to-br from-blue-900 via-blue-700 to-teal-600 p-6 sm:p-10 flex flex-col justify-end text-white shadow-md">

            <h2 class="text-2xl sm:text-3xl md:text-4xl font-extrabold leading-tight">${escapeHtml(state.schoolSettings.schoolName)}</h2>
            <p class="text-xs sm:text-sm text-blue-100 mt-2 max-w-2xl">${escapeHtml(state.schoolSettings.tagline || '')}</p>
          </div>
        `;
      }

      const safeIndex = ((state.slideIndex % activeSlides.length) + activeSlides.length) % activeSlides.length;
      const slide = activeSlides[safeIndex];

      return `
        <div class="relative h-64 sm:h-80 md:h-[400px] rounded-3xl overflow-hidden bg-slate-900 shadow-lg group select-none">
          <img
            src="${escapeHtml(slide.imageUrl || DEFAULT_SLIDE_SVG_1)}"
            onerror="this.src='${DEFAULT_SLIDE_SVG_1}'"
            alt="${escapeHtml(slide.title)}"
            class="w-full h-full object-cover transition-all duration-700"
          />
          <div class="absolute inset-0 bg-gradient-to-t from-slate-950/85 via-slate-900/35 to-transparent"></div>

          <!-- Badge Nomor Slide -->
          <div class="absolute top-4 right-4 px-3 py-1 rounded-full bg-slate-950/60 backdrop-blur-md text-white text-[11px] font-semibold">
            ${safeIndex + 1} / ${activeSlides.length}
          </div>

          <div class="absolute inset-x-0 bottom-0 p-5 sm:p-8 md:p-10 text-white">
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-blue-600/85 backdrop-blur-md text-[11px] font-semibold mb-2.5">
              <i data-lucide="sparkles" class="w-3 h-3"></i> Sorotan Sekolah
            </span>
            <h2 class="text-xl sm:text-2xl md:text-4xl font-extrabold leading-tight max-w-3xl">${escapeHtml(slide.title)}</h2>
            ${
              slide.subtitle
                ? `<p class="text-xs sm:text-sm text-slate-200 mt-1.5 max-w-2xl line-clamp-2">${escapeHtml(slide.subtitle)}</p>`
                : ''
            }

            <!-- Kontrol Navigasi Slide & Dots -->
            <div class="mt-4 flex items-center justify-between gap-3">
              <div class="flex flex-wrap items-center gap-1.5 max-w-[70%]">
                ${activeSlides
                  .map(
                    (_, idx) => `
                    <button onclick="goToSlide(${idx})" aria-label="Slide ${idx + 1}" class="h-2 rounded-full transition-all ${
                      idx === safeIndex ? 'w-7 bg-white' : 'w-2 bg-white/45 hover:bg-white/75'
                    }"></button>
                  `
                  )
                  .join('')}
              </div>
              <div class="flex items-center gap-2 shrink-0">
                <button onclick="changeSlide(-1)" aria-label="Slide Sebelumnya" class="w-9 h-9 rounded-xl bg-white/15 hover:bg-white/30 backdrop-blur-md flex items-center justify-center text-white transition active:scale-95">
                  <i data-lucide="chevron-left" class="w-5 h-5"></i>
                </button>
                <button onclick="changeSlide(1)" aria-label="Slide Berikutnya" class="w-9 h-9 rounded-xl bg-white/15 hover:bg-white/30 backdrop-blur-md flex items-center justify-center text-white transition active:scale-95">
                  <i data-lucide="chevron-right" class="w-5 h-5"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderAnnouncementSliderInner(ann, heightClass = 'h-48 sm:h-64') {
      const photos = Array.isArray(ann.photos) ? ann.photos.filter(Boolean) : [];
      if (photos.length === 0) return '';

      const rawIdx = state.annSlideIndices[ann.id] || 0;
      const safeIdx = ((rawIdx % photos.length) + photos.length) % photos.length;

      return `
        <div class="relative ${heightClass} w-full rounded-2xl overflow-hidden bg-slate-900 mb-4 group select-none">
          <img
            src="${escapeHtml(photos[safeIdx])}"
            onerror="this.src='${DEFAULT_SLIDE_SVG_1}'"
            alt="${escapeHtml(ann.title)} - Foto ${safeIdx + 1}"
            class="w-full h-full object-cover transition-all duration-500"
          />
          <div class="absolute inset-x-0 bottom-0 h-16 bg-gradient-to-t from-slate-950/75 to-transparent pointer-events-none"></div>

          <span class="absolute top-3 right-3 px-2.5 py-1 rounded-full bg-slate-950/70 backdrop-blur-md text-white text-[11px] font-semibold inline-flex items-center gap-1">
            <i data-lucide="images" class="w-3 h-3"></i> ${safeIdx + 1} / ${photos.length}
          </span>

          ${
            photos.length > 1
              ? `
                <button
                  type="button"
                  onclick="changeAnnSlide('${ann.id}', -1)"
                  aria-label="Foto Sebelumnya"
                  class="absolute left-2.5 top-1/2 -translate-y-1/2 w-8 h-8 rounded-xl bg-white/85 hover:bg-white text-slate-900 shadow-md flex items-center justify-center transition active:scale-95"
                >
                  <i data-lucide="chevron-left" class="w-4 h-4"></i>
                </button>
                <button
                  type="button"
                  onclick="changeAnnSlide('${ann.id}', 1)"
                  aria-label="Foto Berikutnya"
                  class="absolute right-2.5 top-1/2 -translate-y-1/2 w-8 h-8 rounded-xl bg-white/85 hover:bg-white text-slate-900 shadow-md flex items-center justify-center transition active:scale-95"
                >
                  <i data-lucide="chevron-right" class="w-4 h-4"></i>
                </button>
                <div class="absolute bottom-2.5 inset-x-0 flex items-center justify-center gap-1.5 px-3">
                  ${photos
                    .map(
                      (_, idx) => `
                      <button
                        type="button"
                        onclick="goToAnnSlide('${ann.id}', ${idx})"
                        aria-label="Foto ${idx + 1}"
                        class="h-1.5 rounded-full transition-all ${
                          idx === safeIdx ? 'w-5 bg-white' : 'w-1.5 bg-white/55 hover:bg-white/85'
                        }"
                      ></button>
                    `
                    )
                    .join('')}
                </div>
              `
              : ''
          }
        </div>
      `;
    }

    function renderAnnouncementSlider(ann, heightClass = 'h-48 sm:h-64') {
      const photos = Array.isArray(ann.photos) ? ann.photos.filter(Boolean) : [];
      if (photos.length === 0) return '';
      return `<div data-ann-slider="${ann.id}" data-height="${heightClass}">${renderAnnouncementSliderInner(ann, heightClass)}</div>`;
    }

    window.changeAnnSlide = function (annId, delta) {
      const ann = state.announcements.find((a) => a.id === annId);
      const photos = Array.isArray(ann?.photos) ? ann.photos.filter(Boolean) : [];
      if (photos.length <= 1) return;
      const curr = state.annSlideIndices[annId] || 0;
      state.annSlideIndices[annId] = (curr + delta + photos.length) % photos.length;
      document.querySelectorAll(`[data-ann-slider="${annId}"]`).forEach((box) => {
        const hClass = box.getAttribute('data-height') || 'h-48 sm:h-64';
        box.innerHTML = renderAnnouncementSliderInner(ann, hClass);
      });
      if (window.lucide) window.lucide.createIcons();
    };

    window.goToAnnSlide = function (annId, idx) {
      const ann = state.announcements.find((a) => a.id === annId);
      if (!ann) return;
      state.annSlideIndices[annId] = idx;
      document.querySelectorAll(`[data-ann-slider="${annId}"]`).forEach((box) => {
        const hClass = box.getAttribute('data-height') || 'h-48 sm:h-64';
        box.innerHTML = renderAnnouncementSliderInner(ann, hClass);
      });
      if (window.lucide) window.lucide.createIcons();
    };

      return `

            ${
              menu.imageUrl
                ? `<div class="h-52 sm:h-72 w-full bg-slate-900 overflow-hidden">

                          <label class="block text-xs font-semibold text-slate-700 mb-1.5">Status Pendaftaran</label>
                          <select id="admin-spmb-open" class="w-full px-4 py-2.5 rounded-xl bg-white border border-slate-200 text-sm">
                            <option value="true" ${s.spmbOpen ? 'selected' : ''}>Dibuka (Menerima Pendaftar)</option>
                            <option value="false" ${!s.spmbOpen ? 'selected' : ''}>Ditutup</option>
                          </select>
                        </div>
                        <div>
                          <label class="block text-xs font-semibold text-slate-700 mb-1.5">Tahun Ajaran SPMB</label>
                          <input id="admin-spmb-year" type="text" value="${escapeHtml(s.spmbYear || '2026/2027')}" class="w-full px-4 py-2.5 rounded-xl bg-white border border-slate-200 text-sm" />
                        </div>
                      </div>
                      <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Informasi & Persyaratan SPMB</label>
                        <textarea id="admin-spmb-info" rows="3" class="w-full px-4 py-2.5 rounded-xl bg-white border border-slate-200 text-sm">${escapeHtml(s.spmbInfo || '')}</textarea>
                      </div>
                      <button type="submit" class="px-5 py-2.5 rounded-xl bg-blue-600 text-white text-xs font-semibold">Simpan Pengaturan SPMB</button>
                    </form>

                    <div class="glass-card rounded-3xl p-6 space-y-4">
                      <div class="flex items-center justify-between">
                        <h3 class="text-base font-bold text-slate-900">Daftar Calon Murid Baru (${state.spmbRegistrations.length})</h3>
                      </div>
                      ${
                        state.spmbRegistrations.length === 0
                          ? `<p class="text-xs text-slate-500">Belum ada pendaftar SPMB.</p>`
                          : `<div class="space-y-3">
                              ${state.spmbRegistrations
                                .map(
                                  (r) => `
                                  <div class="p-4 rounded-2xl bg-white border border-slate-200 flex flex-col md:flex-row md:items-center justify-between gap-3">
                                    <div>
                                      <div class="flex items-center gap-2">
                                        <span class="text-xs font-mono font-bold text-blue-800 bg-blue-50 px-2.5 py-0.5 rounded-full">${escapeHtml(r.regNumber)}</span>
                                        <span class="text-xs text-slate-400">NISN: ${escapeHtml(r.nisn)}</span>
                                      </div>
                                      <h4 class="text-sm font-bold text-slate-900 mt-1">${escapeHtml(r.studentName)} (${escapeHtml(r.gender)})</h4>
                                      <p class="text-xs text-slate-500">Asal: ${escapeHtml(r.originSchool)} • Minat: ${escapeHtml(r.programChoice)} • WA: ${escapeHtml(r.parentPhone)}</p>
                                    </div>
                                    <div class="flex items-center gap-2">
                                      <select onchange="updateSpmbApplicantStatus('${r.id}', this.value)" class="px-3 py-2 rounded-xl border border-slate-200 text-xs font-semibold bg-slate-50">
                                        <option value="Menunggu Verifikasi" ${r.status === 'Menunggu Verifikasi' ? 'selected' : ''}>Menunggu Verifikasi</option>
                                        <option value="Diterima" ${r.status === 'Diterima' ? 'selected' : ''}>Diterima</option>
                                        <option value="Cadangan" ${r.status === 'Cadangan' ? 'selected' : ''}>Cadangan</option>
                                      </select>
                                      <button onclick="deleteSpmbApplicant('${r.id}')" class="p-2 rounded-xl bg-red-50 text-red-600 hover:bg-red-100">
                                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                                      </button>
                                    </div>
                                  </div>
                                `
                                )
                                .join('')}
                            </div>`
                      }
                    </div>
                  </div>
                `
                : ''
            }

            ${
              state.adminTab === 'menus'
                ? `
                  <div class="space-y-6">
                    <form onsubmit="addCustomMenu(event)" class="glass-card rounded-3xl p-6 sm:p-8 space-y-4">
                      <div>
                        <h3 class="text-lg font-bold text-slate-900">Tambah Menu Website Baru</h3>
                        <p class="text-xs text-slate-500 mt-0.5">Menu baru akan langsung muncul pada Navigasi Atas Desktop maupun Menu Responsif HP & Tablet.</p>
                      </div>
                      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                          <label class="block text-xs font-semibold text-slate-700 mb-1.5">Nama Menu *</label>
                          <input id="cmenu-title" type="text" required placeholder="Contoh: Ekstrakurikuler / Fasilitas / Prestasi" class="w-full px-4 py-2.5 rounded-xl bg-white border border-slate-200 text-sm" />
                        </div>
                        <div>
                          <label class="block text-xs font-semibold text-slate-700 mb-1.5">Pilih Ikon Menu Kekinian</label>
                          <select id="cmenu-icon" class="w-full px-4 py-2.5 rounded-xl bg-white border border-slate-200 text-sm">
                            <option value="trophy">Piala / Prestasi (trophy)</option>
                            <option value="building-2">Gedung / Fasilitas (building-2)</option>
                            <option value="book-open">Perpustakaan / Kurikulum (book-open)</option>
                            <option value="sparkles">Ekstrakurikuler / Kreativitas (sparkles)</option>
                            <option value="calendar">Agenda Sekolah (calendar)</option>
                            <option value="phone-call">Kontak & Layanan (phone-call)</option>
                            <option value="folder-open">Halaman Informasi (folder-open)</option>
                          </select>
                        </div>
                        <div>
                          <label class="block text-xs font-semibold text-slate-700 mb-1.5">Subjudul Halaman</label>
                          <input id="cmenu-subtitle" type="text" placeholder="Keterangan singkat halaman" class="w-full px-4 py-2.5 rounded-xl bg-white border border-slate-200 text-sm" />
                        </div>
                        <div>
                          <label class="block text-xs font-semibold text-slate-700 mb-1.5">Banner Gambar Halaman (Opsional)</label>
                          <input id="cmenu-image-file" type="file" accept="image/*" class="block w-full text-xs text-slate-600 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white" />
                        </div>
                      </div>
                      <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Isi Konten Halaman Menu *</label>
                        <textarea id="cmenu-content" rows="4" required placeholder="Tuliskan informasi lengkap yang akan ditampilkan saat pengunjung membuka menu ini..." class="w-full px-4 py-2.5 rounded-xl bg-white border border-slate-200 text-sm"></textarea>
                      </div>
                      <button type="submit" class="px-6 py-3 rounded-xl bg-blue-600 text-white text-xs font-semibold flex items-center gap-2">
                        <i data-lucide="folder-plus" class="w-4 h-4"></i> Tambahkan Menu ke Website
                      </button>
                    </form>

                    <div class="glass-card rounded-3xl p-6 space-y-3">
                      <h3 class="text-base font-bold text-slate-900">Daftar Menu Dinamis Aktif (${state.customMenus.length})</h3>
                      ${
                        state.customMenus.length === 0
                          ? `<p class="text-xs text-slate-500">Belum ada menu dinamis yang dibuat.</p>`
                          : `<div class="space-y-2.5">
                              ${state.customMenus
                                .map(
                                  (m) => `
                                  <div class="p-4 rounded-2xl bg-white border border-slate-200 flex items-center justify-between gap-3">
                                    <div class="flex items-center gap-3 min-w-0">
                                      <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center shrink-0">
                                        <i data-lucide="${escapeHtml(m.icon || 'folder-open')}" class="w-5 h-5"></i>
                                      </div>
                                      <div class="min-w-0">
                                        <h4 class="text-sm font-bold text-slate-900 truncate">${escapeHtml(m.title)}</h4>
                                        <p class="text-xs text-slate-500 truncate">${escapeHtml(m.subtitle || '')}</p>
                                      </div>
                                    </div>
                                    <div class="flex items-center gap-2">
                                      <button onclick="navigateTo('custom:${m.id}')" class="px-3 py-1.5 rounded-xl bg-slate-100 text-slate-700 text-xs font-semibold">Lihat</button>
                                      <button onclick="deleteCustomMenu('${m.id}', '${escapeHtml(m.title)}')" class="px-3 py-1.5 rounded-xl bg-red-50 text-red-600 hover:bg-red-100 text-xs font-semibold flex items-center gap-1">
                                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Hapus
                                      </button>
                                    </div>
                                  </div>
                                `
                                )
                                .join('')}
                            </div>`
                      }
                    </div>
                  </div>
                `
                : ''
            }

            ${
              state.adminTab === 'announcements'
                ? `
                  <div class="space-y-6">
                    <form onsubmit="addAnnouncement(event)" class="glass-card rounded-3xl p-6 space-y-4">
                      <h3 class="text-lg font-bold text-slate-900">Terbitkan Pengumuman Baru</h3>
                      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="md:col-span-1">
                          <label class="block text-xs font-semibold text-slate-700 mb-1.5">Kategori</label>
                          <select id="ann-category" class="w-full px-4 py-2.5 rounded-xl bg-white border border-slate-200 text-sm">
                            <option value="Akademik">Akademik</option>
                            <option value="Kegiatan">Kegiatan</option>
                            <option value="Prestasi">Prestasi</option>
                            <option value="Umum">Umum</option>
                          </select>
                        </div>
                        <div class="md:col-span-2">
                          <label class="block text-xs font-semibold text-slate-700 mb-1.5">Visibilitas Akses</label>
                          <select id="ann-visibility" class="w-full px-4 py-2.5 rounded-xl bg-white border border-slate-200 text-sm">
                            <option value="public">Publik (Tampil untuk Semua Pengunjung)</option>
                            <option value="internal">Internal (Khusus Warga Sekolah yang Login)</option>
                          </select>
                        </div>
                      </div>
                      <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Judul Pengumuman *</label>
                        <input id="ann-title" type="text" required placeholder="Judul informasi" class="w-full px-4 py-2.5 rounded-xl bg-white border border-slate-200 text-sm" />
                      </div>
                      <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Unggah Beberapa Foto untuk Slide Pengumuman (Opsional)</label>
                        <input id="ann-photos-file" type="file" accept="image/*" multiple onchange="previewAnnouncementPhotos(this)" class="block w-full text-xs text-slate-600 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700" />
                        <p class="text-[11px] text-slate-400 mt-1">Pilih 2 atau lebih foto sekaligus untuk menampilkannya sebagai galeri slide di pengumuman.</p>
                        <div id="ann-photos-preview" class="grid grid-cols-3 sm:grid-cols-5 gap-2 mt-2.5"></div>
                      </div>
                      <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Isi Pengumuman *</label>
                        <textarea id="ann-content" rows="3" required placeholder="Detail pengumuman..." class="w-full px-4 py-2.5 rounded-xl bg-white border border-slate-200 text-sm"></textarea>
                      </div>
                      <button type="submit" class="px-5 py-2.5 rounded-xl bg-blue-600 text-white text-xs font-semibold">Publikasikan Pengumuman</button>
                    </form>

                    <div class="space-y-2.5">
                      ${state.announcements
                        .map((a) => {
                          const photoCount = Array.isArray(a.photos) ? a.photos.filter(Boolean).length : 0;
                          return `
                          <div class="glass-card rounded-2xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                            <div>
                              <div class="flex flex-wrap items-center gap-1.5">
                                <span class="text-[11px] font-semibold px-2.5 py-0.5 rounded-full ${
                                  a.visibility === 'internal' ? 'bg-teal-50 text-teal-700' : 'bg-blue-50 text-blue-700'
                                }">${a.visibility === 'internal' ? 'Internal' : 'Publik'} • ${escapeHtml(a.category)}</span>
                                ${
                                  photoCount > 0
                                    ? `<span class="text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-indigo-50 text-indigo-700 inline-flex items-center gap-1"><i data-lucide="images" class="w-3 h-3"></i> ${photoCount} Foto Slide</span>`
                                    : ''
                                }
                              </div>
                              <h4 class="text-sm font-bold text-slate-900 mt-1">${escapeHtml(a.title)}</h4>
                            </div>
                            <div class="flex items-center gap-2 shrink-0">
                              <label class="cursor-pointer px-3 py-1.5 rounded-xl bg-blue-50 text-blue-700 hover:bg-blue-100 text-xs font-semibold inline-flex items-center gap-1">
                                <i data-lucide="image-plus" class="w-3.5 h-3.5"></i> + Foto Slide
                                <input type="file" accept="image/*" multiple class="hidden" onchange="appendAnnouncementPhotos('${a.id}', this)" />
                              </label>
                              <button onclick="deleteAnnouncement('${a.id}')" class="p-2 rounded-xl bg-red-50 text-red-600 hover:bg-red-100">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                              </button>
                            </div>
                          </div>
                        `;
                        })
                        .join('')}
                    </div>
                  </div>
                `
                : ''
            }

            ${
              state.adminTab === 'users'
                ? `
                  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <!-- Kelola Akun Warga Sekolah -->
                    <div class="space-y-4">
                      <form onsubmit="addSchoolUser(event)" class="glass-card rounded-3xl p-6 space-y-4">
                        <h3 class="text-base font-bold text-slate-900">Tambah Akun Login Warga Sekolah</h3>
                        <div>
                          <label class="block text-xs font-semibold text-slate-700 mb-1">Nama Lengkap Siswa / Guru</label>
                          <input id="suser-fullname" type="text" required placeholder="Contoh: Dewi Lestari" class="w-full px-3.5 py-2 rounded-xl bg-white border border-slate-200 text-sm" />
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                          <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Username / NISN</label>
                            <input id="suser-username" type="text" required placeholder="nisn123" class="w-full px-3.5 py-2 rounded-xl bg-white border border-slate-200 text-sm" />
                          </div>
                          <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
                            <input id="suser-password" type="text" required placeholder="sandi123" class="w-full px-3.5 py-2 rounded-xl bg-white border border-slate-200 text-sm" />
                          </div>
                        </div>
                        <div>
                          <label class="block text-xs font-semibold text-slate-700 mb-1">Peran</label>
                          <select id="suser-role" class="w-full px-3.5 py-2 rounded-xl bg-white border border-slate-200 text-sm">
                            <option value="Siswa">Siswa</option>
                            <option value="Guru">Guru</option>
                            <option value="Staf Tata Usaha">Staf Tata Usaha</option>
                          </select>
                        </div>
                        <button type="submit" class="px-4 py-2.5 rounded-xl bg-teal-600 text-white text-xs font-semibold">Simpan Akun Warga</button>
                      </form>

                      <div class="glass-card rounded-3xl p-5 space-y-2.5">
                        <h4 class="text-sm font-bold text-slate-900">Daftar Akun Warga (${state.schoolUsers.length})</h4>
                        ${state.schoolUsers
                          .map(
                            (u) => `
                            <div class="p-3 rounded-xl bg-white border border-slate-200 flex items-center justify-between text-xs">
                              <div>
                                <p class="font-bold text-slate-900">${escapeHtml(u.fullName)} (${escapeHtml(u.roleLabel)})</p>
                                <p class="text-slate-500 font-mono">ID: ${escapeHtml(u.username)} • Pass: ${escapeHtml(u.password)}</p>
                              </div>
                              <button onclick="deleteSchoolUser('${u.id}')" class="p-1.5 rounded-lg bg-red-50 text-red-600">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                              </button>
                            </div>
                          `
                          )
                          .join('')}
                      </div>
                    </div>

                    <!-- Log Riwayat Pengunjung -->
                    <div class="glass-card rounded-3xl p-6 space-y-4">
                      <div class="flex items-center justify-between">
                        <h3 class="text-base font-bold text-slate-900">Log Aktivitas Pengunjung Terbaru</h3>
                        <span class="px-2.5 py-1 rounded-full bg-teal-50 text-teal-700 text-xs font-bold">Total: ${state.visitorStats.totalVisits}</span>
                      </div>
                      <div class="space-y-2.5 max-h-96 overflow-y-auto custom-scroll">
                        ${
                          state.visitorLogs.length === 0
                            ? `<p class="text-xs text-slate-500">Belum ada catatan kunjungan.</p>`
                            : state.visitorLogs
                                .map(
                                  (log) => `
                                  <div class="p-3 rounded-xl bg-white border border-slate-200 flex items-center justify-between text-xs">
                                    <div>
                                      <p class="font-semibold text-slate-800">${escapeHtml(log.device)} • ${escapeHtml(log.os)}</p>
                                      <p class="text-slate-500">${escapeHtml(log.browser)}</p>
                                    </div>
                                    <span class="text-slate-400 font-medium">${escapeHtml(log.timeText || '')}</span>
                                  </div>
                                `
                                )
                                .join('')
                        }
                      </div>
                    </div>
                  </div>
                `
                : ''
            }
          </div>
        </div>
      `;
    }

    // =========================================================================
    // MAIN RENDER ORCHESTRATOR
    // =========================================================================
    function renderApp() {
      // Update Top Header & Footer Branding (Logo Dinamis)
      const logoSrc = state.schoolSettings.logoUrl || DEFAULT_LOGO_SVG;
      const topLogo = document.getElementById('top-logo');
      if (topLogo) {
        topLogo.src = logoSrc;
        topLogo.onerror = () => (topLogo.src = DEFAULT_LOGO_SVG);
      }

      document.getElementById('top-school-name').textContent = state.schoolSettings.schoolName;
      document.getElementById('top-tagline').textContent = state.schoolSettings.tagline || '';

      const footerName = document.getElementById('footer-school-name');
      const footerAddr = document.getElementById('footer-school-address');
      if (footerName) footerName.textContent = state.schoolSettings.schoolName;
      if (footerAddr) footerAddr.textContent = state.schoolSettings.address || '';

      // Banner Mode Preview (Strictly hidden if IS_PREVIEW === false)
      const previewBanner = document.getElementById('preview-mode-banner');
      if (IS_PREVIEW) {
        previewBanner.classList.remove('hidden');
      } else {
        previewBanner.classList.add('hidden');
      }

      // Render Navigasi
      renderNavigation();

      // Render Konten Utama Sesuai Route
      const contentEl = document.getElementById('app-content');
      if (state.currentRoute === 'home') {
        contentEl.innerHTML = renderHomeView();
      } else if (state.currentRoute === 'teachers') {
        contentEl.innerHTML = renderTeachersView();
      } else if (state.currentRoute === 'spmb') {
        contentEl.innerHTML = renderSpmbView();
      } else if (state.currentRoute === 'info') {
        contentEl.innerHTML = renderInfoView();
      } else if (state.currentRoute === 'auth') {
        contentEl.innerHTML = renderAuthView();
      } else if (state.currentRoute === 'admin') {
        contentEl.innerHTML = renderAdminView();
      } else if (state.currentRoute.startsWith('custom:')) {
        const menuId = state.currentRoute.replace('custom:', '');
        contentEl.innerHTML = renderCustomMenuView(menuId);
      } else {
        contentEl.innerHTML = renderHomeView();
      }

      if (window.lucide) {
        window.lucide.createIcons();
      }
    }

    // Boot Application
    recordVisitorSession();
    initProductionRealtimeListeners();
    renderApp();
  </script>
</body>
</html>
